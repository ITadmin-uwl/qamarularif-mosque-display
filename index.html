
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064e3b">
  <title>QamarulArif Admin Login</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(140deg, #022c22, #064e3b, #105c45);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 38px 28px;
      text-align: center;
      border: 1px solid rgba(230,201,139,.4);
      border-radius: 22px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .logo {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 2px solid #e6c98b;
      border-radius: 50%;
      color: #e6c98b;
      font-size: 30px;
    }

    h1 {
      margin: 10px 0;
      font: normal 38px Georgia, serif;
    }

    .subtitle {
      color: #d7e9df;
      font-size: 14px;
      line-height: 1.7;
    }

    .login {
      margin: 30px auto 18px;
      display: flex;
      justify-content: center;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0,0,0,.2);
      text-align: left;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.7;
    }

    .note {
      color: #e6c98b;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 24px;
    }

    footer {
      margin-top: 30px;
      color: #b7d0c4;
      font-size: 10px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">ق</div>

    <h1>QamarulArif</h1>

    <p class="subtitle">
      Mosque Digital Display<br>
      Administration Portal
    </p>

    <div class="login">
      <div id="g_id_onload"
        data-client_id="132233719668-h82suq66l3bsfa3dik3slp90hp978803.apps.googleusercontent.com"
        data-callback="handleGoogleLogin"
        data-auto_prompt="false">
      </div>

      <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="continue_with"
        data-shape="rectangular"
        data-logo_alignment="left">
      </div>
    </div>

    <div id="result"></div>

    <p class="note">
      Secure Google Identity Verification<br>
      Application access is subject to administrator approval.
    </p>

    <footer>
      QAMARULARIF MOSQUE DIGITAL DISPLAY<br><br>
      VERSION 1.1.0
    </footer>
  </main>

  <script>
    const API_URL =
      "https://qamarularif-api.cloudsaas8.workers.dev";

    async function handleGoogleLogin(response) {
      const result = document.getElementById("result");

      result.style.display = "block";
      result.textContent = "Verifying Google identity...";

      try {
        const apiResponse = await fetch(
          API_URL + "/auth/google",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              credential: response.credential
            })
          }
        );

        const data = await apiResponse.json();

        if (!apiResponse.ok || !data.success) {
          throw new Error(
            data.error || "Google verification failed."
          );
        }

        result.innerHTML = "";

        const heading = document.createElement("strong");
        heading.textContent = "Google identity verified";

        const name = document.createElement("div");
        name.textContent = "Name: " + data.user.name;

        const email = document.createElement("div");
        email.textContent = "Email: " + data.user.email;

        const status = document.createElement("div");
        status.textContent =
          "Application access: Pending role verification";

        result.append(heading, name, email, status);

      } catch (error) {
        result.textContent =
          "Verification failed: " + error.message;
      }
    }
  </script>
</body>
</html>
