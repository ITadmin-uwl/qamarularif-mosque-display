
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064e3b">

  <title>QamarulArif Admin Portal</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(
        140deg,
        #022c22,
        #064e3b,
        #105c45
      );
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 38px 28px;
      text-align: center;
      border: 1px solid rgba(230,201,139,.4);
      border-radius: 22px;
      background: rgba(255,255,255,.06);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }

    .logo {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 2px solid #e6c98b;
      border-radius: 50%;
      color: #e6c98b;
      font-size: 30px;
    }

    h1 {
      margin: 10px 0;
      font: normal 38px Georgia, serif;
    }

    .subtitle {
      color: #d7e9df;
      font-size: 14px;
      line-height: 1.7;
    }

    .login {
      margin: 30px auto 18px;
      display: flex;
      justify-content: center;
      min-height: 42px;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(0,0,0,.2);
      text-align: left;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.8;
    }

    #result.success {
      border: 1px solid rgba(134,239,172,.5);
    }

    #result.error {
      border: 1px solid rgba(252,165,165,.5);
    }

    #result.loading {
      border: 1px solid rgba(230,201,139,.4);
    }

    .result-heading {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .role {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(230,201,139,.15);
      color: #e6c98b;
      font-weight: bold;
      letter-spacing: .5px;
    }

    .note {
      color: #e6c98b;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 24px;
    }

    footer {
      margin-top: 30px;
      color: #b7d0c4;
      font-size: 10px;
      letter-spacing: 1px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 32px 20px;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">ق</div>

    <h1>QamarulArif</h1>

    <p class="subtitle">
      Mosque Digital Display<br>
      Administration Portal
    </p>

    <div class="login">

      <div id="g_id_onload"
        data-client_id="132233719668-h82suq66l3bsfa3dik3slp90hp978803.apps.googleusercontent.com"
        data-callback="handleGoogleLogin"
        data-auto_prompt="false">
      </div>

      <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="continue_with"
        data-shape="rectangular"
        data-logo_alignment="left">
      </div>

    </div>

    <div id="result" role="status" aria-live="polite"></div>

    <p class="note">
      Secure Google Identity Verification<br>
      Application access is subject to administrator approval.
    </p>

    <footer>
      QAMARULARIF MOSQUE DIGITAL DISPLAY<br><br>
      VERSION 1.2.0
    </footer>

  </main>

  <script>

    const API_URL =
      "https://qamarularif-api.cloudsaas8.workers.dev";

    const resultBox = document.getElementById("result");

    function showMessage(message, type) {
      resultBox.style.display = "block";
      resultBox.className = type;
      resultBox.textContent = message;
    }

    function showAuthorizedUser(user) {

      resultBox.innerHTML = "";

      const heading = document.createElement("strong");
      heading.className = "result-heading";
      heading.textContent = "Access Granted";

      const name = document.createElement("div");
      name.textContent = "Name: " + (user.name || "-");

      const email = document.createElement("div");
      email.textContent = "Email: " + (user.email || "-");

      const roleLabel = document.createElement("div");
      roleLabel.textContent = "Assigned Role:";

      const role = document.createElement("span");
      role.className = "role";
      role.textContent = user.role || "UNKNOWN";

      const mosque = document.createElement("div");
      mosque.textContent =
        "Mosque ID: " + (user.mosqueId || "-");

      const message = document.createElement("div");
      message.style.marginTop = "10px";
      message.textContent =
        "Google identity and account authorization verified successfully.";

      resultBox.append(
        heading,
        name,
        email,
        roleLabel,
        role,
        mosque,
        message
      );

      resultBox.style.display = "block";
      resultBox.className = "success";
    }

    function getErrorMessage(errorCode) {

      const messages = {
        USER_NOT_AUTHORIZED:
          "Your Google account is not registered in the mosque system.",

        USER_NOT_REGISTERED:
          "Your account has not been registered by the administrator.",

        INVALID_USER_ROLE:
          "Your account has an invalid role. Please contact the administrator.",

        DUPLICATE_ACTIVE_USER_RECORDS:
          "Duplicate active user records detected. Please contact the administrator.",

        REQUEST_EXPIRED:
          "The authentication request has expired. Please try again.",

        INVALID_SIGNATURE:
          "Backend security verification failed.",

        REPLAYED_REQUEST:
          "This authentication request has already been used.",

        AUTHENTICATION_SERVICE_ERROR:
          "Authentication service is temporarily unavailable.",

        BACKEND_AUTH_FAILED:
          "The backend could not authorize your account."
      };

      return messages[errorCode] ||
        "Login could not be completed. Please try again.";
    }

    async function handleGoogleLogin(response) {

      if (!response || !response.credential) {
        showMessage(
          "Google did not return a valid login credential.",
          "error"
        );
        return;
      }

      showMessage(
        "Google identity verified. Checking account permissions...",
        "loading"
      );

      try {

        const apiResponse = await fetch(
          API_URL + "/auth/google",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              credential: response.credential
            })
          }
        );

        let data;

        try {
          data = await apiResponse.json();
        } catch {
          throw new Error("INVALID_SERVER_RESPONSE");
        }

        if (
          !apiResponse.ok ||
          !data.success ||
          !data.authorized ||
          !data.user
        ) {
          throw new Error(
            data.error || "BACKEND_AUTH_FAILED"
          );
        }

        showAuthorizedUser(data.user);

      } catch (error) {

        console.error("Login error:", error);

        const message =
          error.message === "Failed to fetch"
            ? "Cannot connect to the authentication server. Please check the API and CORS configuration."
            : getErrorMessage(error.message);

        showMessage(
          "Access Denied: " + message,
          "error"
        );
      }
    }

    window.handleGoogleLogin = handleGoogleLogin;

  </script>

</body>
</html>
